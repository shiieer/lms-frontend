name: Deploy Frontend

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy Docker files to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} 'mkdir -p /srv/apps/koupii-frontend'
          scp -o StrictHostKeyChecking=no Dockerfile.frontend root@${{ secrets.VPS_HOST }}:/srv/apps/koupii-frontend/
          scp -o StrictHostKeyChecking=no docker-compose.yml root@${{ secrets.VPS_HOST }}:/srv/apps/koupii-frontend/
          scp -o StrictHostKeyChecking=no .dockerignore root@${{ secrets.VPS_HOST }}:/srv/apps/koupii-frontend/ || true

      - name: Sync source to VPS current
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} 'mkdir -p /srv/apps/koupii-frontend/current'
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.VPS_HOST }}:/srv/apps/koupii-frontend/current

      - name: Inject env (optional)
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          if [ -n "${NEXT_PUBLIC_BACKEND_URL}" ]; then
            echo "NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}" | \
              ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
              'cat > /srv/apps/koupii-frontend/current/.env'
          else
            echo "NEXT_PUBLIC_BACKEND_URL not set; skipping .env injection"
          fi

      - name: Build & Up (parallel to current manual app)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} '
            cd /srv/apps/koupii-frontend
            docker compose build --no-cache && docker compose up -d
          '

      - name: Health check container
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} '
            for i in {1..10}; do
              if curl -sf http://127.0.0.1:8082/ > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for container to be ready... ($i/10)"
              sleep 3
            done
            echo "Health check failed"
            exit 1
          '

      - name: Cleanup old images
        if: success()
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} '
            docker image prune -f --filter "dangling=true"
            docker system prune -f --volumes || true
          '
